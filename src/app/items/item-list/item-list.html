<section>
  <div class="section-title title-with-filter">
    <h3>Items</h3>
    <input
      #filterInput
      class="form-control filter"
      type="search"
      placeholder="Filter by name..."
      aria-label="Filter items by name"
      (input)="searchText.set(filterInput.value)"
    />
  </div>
  <ul class="card-list">
    @for (item of filteredItems(); track item.id) {
      <li class="card">
        <div class="card-title">{{ item.name }}</div>
        <img class="card-image" src="img/item-image.png" alt="Image of {{ item.name }}" />
        <div class="card-footer">
          <div>Price: {{ item.price | currency: 'EUR' }}</div>
          <div class="stock">
            <span>{{ stockUrgencyDisplay[item.stockUrgency].label }}</span>
            <img class="icon" [src]="stockUrgencyDisplay[item.stockUrgency].icon" alt="Stock urgency" />
          </div>
        </div>
      </li>
    } @empty {
      <li>No items found.</li>
    }
  </ul>
</section>
